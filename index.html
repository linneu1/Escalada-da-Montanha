<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Grande Corrida da Montanha 🏆</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #0f172a;
      color: #fff;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: manipulation;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 440px;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
    }

    #game-wrapper:fullscreen,
    #game-wrapper:-webkit-full-screen {
      max-width: 100vw;
      max-height: 100vh;
      padding: 12px;
      background: #0f172a;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }

    canvas {
      background: #1e293b;
      border: 3px solid #38bdf8;
      border-radius: 12px;
      box-shadow: 0 8px 25px rgba(56, 189, 248, 0.2);
      image-rendering: pixelated;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 320 / 440;
      object-fit: contain;
    }

    .controls-panel {
      width: 100%;
      background: #1e293b;
      border: 2px solid #334155;
      border-radius: 10px;
      padding: 8px;
      margin-top: 6px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .dice-area {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0f172a;
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
    }

    .dice-btn {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #fff;
      border: none;
      border-radius: 6px;
      padding: 8px 14px;
      font-weight: bold;
      font-size: 13px;
      cursor: pointer;
      box-shadow: 0 3px 0 #92400e;
      transition: transform 0.05s;
    }

    .dice-btn:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .dice-result {
      font-size: 13px;
      font-weight: bold;
      color: #38bdf8;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .student-card {
      background: #0f172a;
      border-radius: 8px;
      padding: 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      border: 2px solid #334155;
    }

    .student-name {
      font-size: 12px;
      font-weight: 800;
    }

    .btn-group {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .btn-step {
      flex: 1;
      padding: 5px 0;
      font-size: 13px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,0.4);
    }

    .btn-step:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .btn-up { background: #10b981; }
    .btn-down { background: #ef4444; }

    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.8);
      color: #38bdf8;
      border: 1px solid #38bdf8;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }

    .reset-btn {
      background: #64748b;
      color: #fff;
      border: none;
      border-radius: 4px;
      padding: 2px 6px;
      font-size: 10px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Tela Cheia</button>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="320" height="440"></canvas>
    </div>
    
    <div class="controls-panel">
      <div class="dice-area">
        <button class="dice-btn" onclick="rollDice()">🎲 Sorteio Rápido</button>
        <span class="dice-result" id="diceText">Vez do jogo!</span>
        <button class="reset-btn" onclick="resetGame()">🔄 Reiniciar</button>
      </div>

      <div class="students-grid" id="controlsGrid"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    const racers = [
      { name: 'Gregório', color: '#ef4444', level: 0, icon: '🔥', avatar: '🏎️' },
      { name: 'Frederico', color: '#3b82f6', level: 0, icon: '⚡', avatar: '🚀' },
      { name: 'Kauê', color: '#10b981', level: 0, icon: '👑', avatar: '⚡' }
    ];

    const maxLevels = 6;
    let turnIndex = 0;
    let winner = null;
    let particles = [];

    const controlsGrid = document.getElementById('controlsGrid');

    function renderControls() {
      controlsGrid.innerHTML = '';
      racers.forEach((racer, index) => {
        const card = document.createElement('div');
        card.className = 'student-card';
        card.style.borderColor = racer.color;
        card.innerHTML = `
          <span class="student-name" style="color: ${racer.color}">${racer.icon} ${racer.name}</span>
          <div class="btn-group">
            <button class="btn-step btn-down" onclick="moveRacer(${index}, -1)">-1</button>
            <button class="btn-step btn-up" onclick="moveRacer(${index}, 1)" style="background:${racer.color}">+1</button>
          </div>
        `;
        controlsGrid.appendChild(card);
      });
    }

    function moveRacer(index, delta) {
      if (winner) return;
      racers[index].level = Math.max(0, Math.min(maxLevels, racers[index].level + delta));

      if (racers[index].level === maxLevels && !winner) {
        winner = racers[index];
        createConfetti();
      }
    }

    function rollDice() {
      if (winner) return;
      const step = Math.floor(Math.random() * 3) + 1;
      const currentRacer = racers[turnIndex];
      
      document.getElementById('diceText').innerText = `${currentRacer.name}: +${step} casas!`;
      moveRacer(turnIndex, step);

      turnIndex = (turnIndex + 1) % racers.length;
    }

    function resetGame() {
      racers.forEach(r => r.level = 0);
      winner = null;
      turnIndex = 0;
      particles = [];
      document.getElementById('diceText').innerText = "Corrida Pronta!";
    }

    function createConfetti() {
      for (let i = 0; i < 50; i++) {
        particles.push({
          x: canvas.width / 2,
          y: canvas.height / 2,
          vx: (Math.random() - 0.5) * 6,
          vy: (Math.random() - 0.5) * 6 - 3,
          color: ['#f59e0b', '#ef4444', '#3b82f6', '#10b981', '#ec4899'][Math.floor(Math.random() * 5)],
          size: Math.random() * 5 + 3,
          life: 100
        });
      }
    }

    function gameLoop() {
      update();
      render();
      requestAnimationFrame(gameLoop);
    }

    function update() {
      particles.forEach((p, i) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.1;
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      });
    }

    function render() {
      // Fundo e Montanha
      ctx.fillStyle = '#0f172a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      drawMountain();
      drawLevels();
      drawRacers();
      drawParticles();

      if (winner) {
        drawWinnerOverlay();
      }
    }

    function drawMountain() {
      // Montanha vulcânica/tecnológica
      ctx.fillStyle = '#1e293b';
      ctx.beginPath();
      ctx.moveTo(160, 30);
      ctx.lineTo(310, 410);
      ctx.lineTo(10, 410);
      ctx.fill();

      // Pista Central
      ctx.fillStyle = '#334155';
      ctx.beginPath();
      ctx.moveTo(160, 35);
      ctx.lineTo(280, 410);
      ctx.lineTo(40, 410);
      ctx.fill();

      // Troféu do Topo
      ctx.fillStyle = '#f59e0b';
      ctx.font = '24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🏆', 160, 32);
    }

    function drawLevels() {
      for (let i = 0; i <= maxLevels; i++) {
        const y = getLevelY(i);

        ctx.strokeStyle = i === maxLevels ? '#f59e0b' : 'rgba(255,255,255,0.2)';
        ctx.lineWidth = i === maxLevels ? 3 : 1;
        ctx.beginPath();
        ctx.moveTo(30, y);
        ctx.lineTo(290, y);
        ctx.stroke();

        ctx.fillStyle = '#64748b';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(i === maxLevels ? 'FINISH' : `N${i}`, 8, y + 3);
      }
    }

    function getLevelY(level) {
      const startY = 390;
      const endY = 60;
      return startY - (level * ((startY - endY) / maxLevels));
    }

    function drawRacers() {
      racers.forEach((racer, index) => {
        const y = getLevelY(racer.level);
        // Posições em colunas separadas para cada menino (esquerda, centro, direita)
        const xList = [90, 160, 230];
        const x = xList[index];

        // Rastro de Luz
        ctx.strokeStyle = racer.color;
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(x, 400);
        ctx.lineTo(x, y);
        ctx.stroke();

        // Kart/Avatar
        ctx.fillStyle = racer.color;
        ctx.beginPath();
        ctx.arc(x, y - 10, 14, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // Nome
        ctx.fillStyle = '#0f172a';
        ctx.fillRect(x - 26, y + 6, 52, 14);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 9px sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText(racer.name, x, y + 16);
      });
    }

    function drawParticles() {
      particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      });
    }

    function drawWinnerOverlay() {
      ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
      ctx.fillRect(20, 140, canvas.width - 40, 140);

      ctx.fillStyle = '#f59e0b';
      ctx.font = '900 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('🎉 GRANDE CAMPEÃO! 🎉', canvas.width / 2, 180);

      ctx.fillStyle = winner.color;
      ctx.font = '900 22px sans-serif';
      ctx.fillText(winner.name.toUpperCase(), canvas.width / 2, 215);

      ctx.fillStyle = '#fff';
      ctx.font = '12px sans-serif';
      ctx.fillText('Conquistou o topo da montanha!', canvas.width / 2, 245);
    }

    function toggleFullScreen() {
      const elem = document.getElementById('game-wrapper');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    renderControls();
    gameLoop();
  </script>
</body>
</html>

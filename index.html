<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Escalada da Montanha 🏔️ - Desafio da Turma</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      background: #1e272e;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      touch-action: manipulation;
    }

    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      max-width: 480px;
      max-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px;
    }

    #game-wrapper:fullscreen,
    #game-wrapper:-webkit-full-screen {
      max-width: 100vw;
      max-height: 100vh;
      padding: 12px;
      background: #1e272e;
    }

    .canvas-container {
      position: relative;
      width: 100%;
      flex-grow: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 0;
    }

    canvas {
      background: #80d4ff;
      border: 3px solid #fff;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      max-width: 100%;
      max-height: 100%;
      aspect-ratio: 320 / 480;
      object-fit: contain;
    }

    .controls-panel {
      width: 100%;
      background: #2d3436;
      border: 2px solid #636e72;
      border-radius: 8px;
      padding: 8px;
      margin-top: 6px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .panel-title {
      font-size: 11px;
      font-weight: bold;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: #dfe6e9;
      text-align: center;
    }

    .students-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 6px;
    }

    .student-card {
      background: #353b48;
      border-radius: 6px;
      padding: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      border: 1px solid #485460;
    }

    .student-name {
      font-size: 11px;
      font-weight: bold;
      color: #f5f6fa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }

    .btn-group {
      display: flex;
      gap: 4px;
      width: 100%;
    }

    .btn-step {
      flex: 1;
      padding: 4px 0;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      box-shadow: 0 2px 0 rgba(0,0,0,0.3);
      transition: transform 0.05s;
      touch-action: manipulation;
    }

    .btn-step:active {
      transform: translateY(2px);
      box-shadow: none;
    }

    .btn-up { background: #2ecc71; }
    .btn-down { background: #e74c3c; }

    .fullscreen-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      border: 1px solid #fff;
      border-radius: 6px;
      padding: 5px 8px;
      font-size: 11px;
      font-weight: bold;
      cursor: pointer;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div id="game-wrapper">
    <button class="fullscreen-btn" onclick="toggleFullScreen()">⛶ Tela Cheia</button>

    <div class="canvas-container">
      <canvas id="gameCanvas" width="320" height="480"></canvas>
    </div>
    
    <div class="controls-panel">
      <div class="panel-title">Avance os Alunos 🏔️</div>
      <div class="students-grid" id="controlsGrid"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false;

    // Lista de Alunos e Cores Únicas
    const students = [
      { name: 'Gregório', color: '#e74c3c', level: 0 },
      { name: 'Yasmin', color: '#e040fb', level: 0 },
      { name: 'Maria', color: '#2ecc71', level: 0 },
      { name: 'Kauê', color: '#f1c40f', level: 0 },
      { name: 'Agatha', color: '#3498db', level: 0 },
      { name: 'Frederico', color: '#e67e22', level: 0 }
    ];

    const maxLevels = 5;

    // Monta o painel de botões
    const controlsGrid = document.getElementById('controlsGrid');
    students.forEach((student, index) => {
      const card = document.createElement('div');
      card.className = 'student-card';
      card.innerHTML = `
        <span class="student-name" style="color: ${student.color}">${student.name}</span>
        <div class="btn-group">
          <button class="btn-step btn-down" onclick="moveStudent(${index}, -1)">-</button>
          <button class="btn-step btn-up" onclick="moveStudent(${index}, 1)">+</button>
        </div>
      `;
      controlsGrid.appendChild(card);
    });

    function moveStudent(index, delta) {
      students[index].level = Math.max(0, Math.min(maxLevels, students[index].level + delta));
    }

    function gameLoop() {
      render();
      requestAnimationFrame(gameLoop);
    }

    function render() {
      // Céu com gradiente
      ctx.fillStyle = '#74b9ff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Sol
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.arc(280, 40, 20, 0, Math.PI * 2);
      ctx.fill();

      // Desenha a Montanha
      drawMountain();

      // Desenha os Patamares/Níveis
      drawLevels();

      // Desenha os Alunos na montanha
      drawStudents();
    }

    function drawMountain() {
      // Sombra da montanha
      ctx.fillStyle = '#2d3436';
      ctx.beginPath();
      ctx.moveTo(160, 40);
      ctx.lineTo(310, 440);
      ctx.lineTo(10, 440);
      ctx.fill();

      // Corpo da montanha
      ctx.fillStyle = '#636e72';
      ctx.beginPath();
      ctx.moveTo(160, 40);
      ctx.lineTo(300, 440);
      ctx.lineTo(20, 440);
      ctx.fill();

      // Pico de Neve / Troféu
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.moveTo(160, 40);
      ctx.lineTo(185, 100);
      ctx.lineTo(160, 90);
      ctx.lineTo(135, 100);
      ctx.fill();

      // Bandeira do Topo (Nível 5)
      ctx.fillStyle = '#f1c40f';
      ctx.fillRect(158, 15, 4, 25);
      ctx.fillStyle = '#e74c3c';
      ctx.beginPath();
      ctx.moveTo(162, 15);
      ctx.lineTo(182, 22);
      ctx.lineTo(162, 30);
      ctx.fill();
    }

    function drawLevels() {
      ctx.textAlign = 'center';
      for (let i = 0; i <= maxLevels; i++) {
        const y = getLevelY(i);
        
        // Linha pontilhada do nível
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.moveTo(15, y);
        ctx.lineTo(305, y);
        ctx.stroke();
        ctx.setLineDash([]);

        // Marcador do Nível
        ctx.fillStyle = '#1e272e';
        ctx.fillRect(5, y - 8, 28, 16);
        ctx.fillStyle = '#fff';
        ctx.font = 'bold 9px sans-serif';
        ctx.fillText(i === 5 ? 'TOPO' : `NIV ${i}`, 19, y + 4);
      }
    }

    function getLevelY(level) {
      // Y inicial (Nível 0) = 420; Y final (Nível 5 - Topo) = 70
      const startY = 420;
      const endY = 70;
      return startY - (level * ((startY - endY) / maxLevels));
    }

    function drawStudents() {
      // Agrupa alunos por nível para calcular offset horizontal se compartilharem o mesmo patamar
      const levelGroups = {};
      students.forEach(s => {
        if (!levelGroups[s.level]) levelGroups[s.level] = [];
        levelGroups[s.level].push(s);
      });

      Object.keys(levelGroups).forEach(levelStr => {
        const level = parseInt(levelStr);
        const group = levelGroups[level];
        const y = getLevelY(level);

        group.forEach((student, index) => {
          // Espaçamento horizontal entre avatares no mesmo nível
          const totalInLevel = group.length;
          const spacing = 36;
          const startX = 160 - ((totalInLevel - 1) * spacing) / 2;
          const x = startX + (index * spacing);

          // Desenha Avatar (Círculo com Borda)
          ctx.fillStyle = student.color;
          ctx.beginPath();
          ctx.arc(x, y - 10, 10, 0, Math.PI * 2);
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 2;
          ctx.stroke();

          // Inicial do nome dentro do círculo
          ctx.fillStyle = '#fff';
          ctx.font = 'bold 10px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText(student.name.charAt(0), x, y - 6);

          // Etiqueta com o Nome Completo abaixo
          ctx.fillStyle = 'rgba(0, 0, 0, 0.75)';
          const textWidth = ctx.measureText(student.name).width;
          ctx.fillRect(x - (textWidth / 2) - 3, y + 2, textWidth + 6, 12);

          ctx.fillStyle = '#fff';
          ctx.font = 'bold 8px sans-serif';
          ctx.fillText(student.name, x, y + 11);
        });
      });
    }

    function toggleFullScreen() {
      const elem = document.getElementById('game-wrapper');
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (elem.requestFullscreen) elem.requestFullscreen();
        else if (elem.webkitRequestFullscreen) elem.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    gameLoop();
  </script>
</body>
</html>
